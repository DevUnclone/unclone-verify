[package]
name = "unclone-vault"
version = "0.1.0"
edition = "2021"
description = "A Solana vault that releases funds only against a Winternitz one-time signature."
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Pinned, not floating. A build that follows a moving version cannot be
# reproduced by anyone checking it months from now, and reproducibility is
# the only reason to publish a program's source at all.
solana-program = "=2.1.21"

[dev-dependencies]
serde_json = "1"
hex = "0.4"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
